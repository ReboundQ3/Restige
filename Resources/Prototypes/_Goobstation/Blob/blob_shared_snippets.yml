# Blob-related prototypes that Goob-Station keeps in shared (non-blob) files, collected here for the port.

# --- from _Goobstation/GameRules/roundstart.yml
- type: entity
  id: BlobRule
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: BlobRule

- type: entity
  id: BlobGameMode
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: BlobRule
  - type: GameRule
    minPlayers: 20
  - type: AntagSelection
    selectionTime: JobsAssigned
    antags:
    - !type:LinearAntagCount
      proto: Blob
      range:
        min: 1
        max: 1

# Goob's inline AntagSelection definition, as an upstream antag specifier.
# CommandBlacklistedAntag also blacklists AntagImmune, like Goob's version did.
- type: antagSpecifier
  parent: [ CommandBlacklistedAntag, CyborgBlacklistedAntag ]
  id: Blob
  prefRoles: [ Blob ]
  allowNonHumans: true
  jobBlacklist: [ Chaplain ]
  briefing:
    text: blob-carrier-role-greeting
    color: Plum
    sound: /Audio/Announcements/bloblarm.ogg
  mindRoles:
  - MindRoleBlob

- type: entity
  id: BlobSpawn
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 1
    duration: 1
    earliestStart: 50
    minimumPlayers: 20
    maxOccurrences: 2
  - type: BlobSpawnRule
    carrierBlobProtos:
    - SpawnPointGhostBlobRat
    playersPerCarrierBlob: 30
    maxCarrierBlob: 1

# --- from _Goobstation/GameRules/midround.yml
- type: entity
  parent: BaseGameRule
  id: BlobMidround
  components:
  - type: StationEvent
    weight: 1
    earliestStart: 45
    minimumPlayers: 50
    duration: null
    maxOccurrences: 1
  - type: BlobSpawnRule
    carrierBlobProtos:
    - SpawnPointGhostBlobRat
    playersPerCarrierBlob: 30
    maxCarrierBlob: 1

# --- from _Goobstation/game_presets.yml
- type: gamePreset
  id: Blob
  alias:
  - blab
  name: blob-title
  description: blob-description
  showInVote: false
  rules:
  - BlobGameMode
  - BasicStationEventScheduler
  - BasicRoundstartVariation
  - SubGamemodesRule

# --- from _Goobstation/Damage/containers.yml
- type: damageContainer
  id: Blob
  supportedGroups:
  - Brute
  - Burn

# --- from _Goobstation/Damage/modifier_sets.yml
- type: damageModifierSet
  id: BaseBlob # ReactiveSpines
  coefficients:
    Blunt: 0.35 # little debuff (0.25 -> 0.35)
    Slash: 0.35
    Piercing: 0.35
    Heat: 2.00

- type: damageModifierSet
  id: ElectromagneticWebBlob # Electromagnetic Web
  coefficients:
    Blunt: 0.40 # little buff (0.50 -> 0.40)
    Slash: 0.40
    Piercing: 0.40
    Heat: 2.50
    Shock: 0.50

- type: damageModifierSet
  id: ExplosiveLatticeBlob # Explosive Lattice
  coefficients:
    Blunt: 0.25
    Slash: 0.25
    Piercing: 0.25
    Heat: 3.00
    Shock: 1.50

- type: damageModifierSet
  id: ChainCoatingBlob # Chain coating
  coefficients:
    Blunt: 0.20
    Slash: 0.20
    Piercing: 0.20
    Heat: 1.5

- type: damageModifierSet
  id: SinewyTendonsBlob # Flesh grill
  coefficients:
    Blunt: 0.50
    Slash: 0.50
    Piercing: 0.20
    Heat: 5

- type: damageModifierSet
  id: BlobBlobbernautChainCoating
  coefficients:
    Blunt: 0.25
    Slash: 0.25
    Piercing: 0.25
    Heat: 1.2

- type: damageModifierSet
  id: BlobMob # Blob mobs
  coefficients:
    Blunt: 1
    Slash: 1
    Piercing: 1
    Heat: 1.5

- type: damageModifierSet
  id: BlobBlobbernaut
  coefficients:
    Blunt: 0.5
    Slash: 0.5
    Piercing: 0.5
    Heat: 1.5

- type: damageModifierSet
  id: BlobReflective # If it reflects lasers, then it must be fragile?
  coefficients:
    Blunt: 0.9
    Slash: 0.9
    Piercing: 0.9
    Heat: 1.5

# --- from _Goobstation/tags.yml
- type: Tag
  id: Blobbernaut

# Replaces Goob's Blobmind collectiveMind (_Goobstation/CollectiveMind/collective_minds.yml) with an upstream radio channel.
- type: radioChannel
  id: Blobmind
  name: chat-radio-blobmind
  keycode: 'l'
  frequency: 200.5
  color: "#637b19"
  # long range so the hivemind works anywhere, independent of telecomms
  longRange: true

# --- from _Goobstation/Effects/heal.yml (only the parts blob uses)
- type: entity
  id: EffectHealPlusBase
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.6
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _Goobstation/Blob/heals.rsi
    state: single
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu
  - type: AnimationPlayer


- type: entity
  id: EffectHealPlusTripleBase
  categories: [ HideSpawnMenu ]
  parent: EffectHealPlusBase
  components:
  - type: TimedDespawn
    lifetime: 0.8
  - type: Sprite
    state: triple

- type: entity
  id: EffectHealPlusTripleYellow
  parent: EffectHealPlusTripleBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    color: yellow

